services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: edge_mosquitto
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
      - ./certs:/mosquitto/certs:ro
    restart: always

  influxdb:
    image: influxdb:2.7
    container_name: edge_influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=industrial_org
      - DOCKER_INFLUXDB_INIT_BUCKET=energy_bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-edge-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: edge_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=edge_admin
      - POSTGRES_PASSWORD=edge_password123
      - POSTGRES_DB=energy_management
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always

  ai_engine:
    build: ./ai-service
    container_name: edge_ai_engine
    depends_on:
      - mosquitto
      - influxdb
      - postgres
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=8883
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=my-super-secret-edge-token
      - INFLUX_ORG=industrial_org
      - INFLUX_BUCKET=energy_bucket
      - PG_HOST=postgres
      - PG_DB=energy_management
      - PG_USER=edge_admin
      - PG_PASS=edge_password123
    volumes:
      - ./certs:/app/certs:ro
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: edge_grafana
    ports:
      # Chi mo tren may local vi Grafana khong yeu cau dang nhap
      - "127.0.0.1:3000:3000"
    depends_on:
      - influxdb
      - postgres
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Bo qua man hinh dang nhap: vao thang dashboard voi quyen Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always

volumes:
  influxdb_data:
  postgres_data:
  grafana_data:
